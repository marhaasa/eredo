# Claude sandbox egress proxy.
# Only CONNECT (TLS tunnels) to port 443 on allowlisted domains is permitted.
# The allowlist is bind-mounted from proxy at runtime;
# `moat reload` makes squid re-read it.

http_port 3128
pid_filename none
visible_hostname claude-proxy
shutdown_lifetime 1 seconds

# No caching. Debug output goes to stderr via `squid -d 1`; the access log is
# streamed to stdout by the entrypoint (squid drops privileges and cannot
# open the container's stdout itself).
cache deny all
cache_mem 8 MB
cache_log /dev/null
cache_store_log none
logfile_rotate 0
access_log stdio:/var/log/squid/access.log

# Do not advertise the sandbox to upstream servers.
via off
forwarded_for delete
httpd_suppress_version_string on

acl allowed dstdomain "/etc/claude-proxy/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT allowed SSL_ports
http_access deny all
