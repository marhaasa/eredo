name: release
on:
  push:
    tags: ["v*"]

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build every target
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/eredo-$os-$arch$ext" .
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "eredo $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
